# Проверка ядра (domain/app/infra) на каждый push/PR — то, что не
# зависит от lxn/walk и не требует ни Go 1.10.8, ни GOPATH-обвязки (см.
# vet-core/test в Makefile). Полная сборка GUI под Windows — отдельно,
# только на релизный тег (см. release.yml): она в разы дороже и не
# нужна на каждый коммит.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не прошли gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (ядро)
        run: make vet-core

      - name: go test (ядро)
        run: make test
